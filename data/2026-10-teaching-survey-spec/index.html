.mode button{border:0;background:none;padding:7px 18px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.mode button[aria-pressed="true"]{color:#fff;background:var(--c)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.88rem;color:var(--muted);margin-bottom:8px;min-height:1.6em}
.stats b{font-size:1.15rem;color:var(--ink);margin-right:3px}
.stats .r b{color:var(--red)} .stats .g b{color:var(--done)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
svg#map{display:block;width:100%;min-width:980px;height:auto}
.trunkline{stroke:var(--trunk);stroke-width:10;stroke-linecap:round}
.goal{font-size:13px;fill:var(--trunk);font-weight:700}
.tnode{cursor:pointer}
.tnode:focus,.bnode:focus{outline:none}
.tnode:focus-visible circle.c{stroke:var(--ink);stroke-width:6}
.bnode:focus-visible rect{stroke:var(--ink);stroke-width:3}
.tnode circle.c{fill:var(--surface);stroke:var(--trunk);stroke-width:4}
.tnode text.e{font-size:26px}
.tnode text.n{font-size:14px;font-weight:700;fill:var(--ink)}
.tnode text.s{font-size:11.5px;fill:var(--muted)}
.tnode.hit circle.c{stroke:var(--red);stroke-width:6;fill:var(--red-bg)}
.tnode.sel circle.c{stroke-width:7}
.tnode .badge circle{fill:var(--done)} .tnode .badge text{fill:#fff;font-size:11px;font-weight:700}
.branches{transition:opacity .5s}
.edge{fill:none;stroke:var(--grow);stroke-width:2.5;stroke-linecap:round}
.edge.merge{stroke-dasharray:2 5}
.edge.hitl{stroke:var(--red);stroke-width:2;stroke-dasharray:6 5;opacity:.85}
.edge.on{stroke:var(--red);stroke-width:3.5}
.edge.hitl.on{opacity:1}
.bnode{cursor:pointer}
.bnode rect{fill:var(--surface);stroke:var(--grow);stroke-width:1.8;rx:14}
.bnode.origin rect{stroke-width:2.6}
.bnode text{font-size:12.5px;fill:var(--ink)}
.bnode.origin text{font-weight:700}
.bnode.on rect{stroke:var(--red);fill:var(--red-bg);stroke-width:3}
.bnode.dim,.edge.dim{opacity:.18}
.spec rect{fill:var(--trunk-bg);stroke:var(--trunk);stroke-width:1.4}
.spec text{font-size:12px;fill:var(--trunk);font-weight:500}
.note rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
.note text{font-size:11.5px;fill:var(--muted)}
.note text.nt{font-weight:700;fill:var(--ink)}
.spec .stem{stroke:var(--trunk);stroke-width:2;stroke-dasharray:2 4}
.fix rect{fill:var(--done-bg);stroke:var(--done);stroke-width:1.2;rx:9}
.fix text{font-size:11px;fill:var(--done);font-weight:700}
.bnode.new{animation:fade .45s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tnode .exp circle{fill:var(--grow)} .tnode .exp.sp circle{fill:var(--trunk)}
.fadein{animation:fade .45s ease-out}
.bnode .more circle{fill:var(--grow)} .bnode .more text{fill:#fff;font-size:12px;font-weight:700} .tnode .exp text{fill:#fff;font-size:11px;font-weight:700}
.tools{display:flex;gap:6px;align-items:center}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem}
.grow-anim .edge.new:not(.hitl){stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:grow 1.1s ease-out forwards}
.grow-anim .edge.new.merge{animation:none;stroke-dasharray:2 5;stroke-dashoffset:0}
@keyframes grow{to{stroke-dashoffset:0}}
.card{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:14px 18px;min-height:96px}
.card h2{font-family:"Noto Serif TC",serif;font-size:1.2rem;margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .st{font-family:"Noto Sans TC",sans-serif;font-size:.76rem;color:#fff;background:var(--sc);border-radius:999px;padding:1px 10px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.92rem}
.card dt{color:var(--muted);white-space:nowrap}
.card dd{margin:0}
.card dd.bad{color:var(--red)} .card dd.good{color:var(--done)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.grp{margin:2px 0 8px}
.grp h3{font-size:.84rem;margin:0 0 4px;display:flex;align-items:center;gap:6px;color:var(--c)}
.grp h3 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.grp ul{margin:0;padding-left:1.1em;font-size:.9rem}
.grp li{margin-bottom:2px}
.grp li small{color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.chips .sp{font-size:.82rem;padding:1px 10px;border-radius:999px;background:var(--trunk-bg);color:var(--trunk);border:1px solid var(--trunk)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:reduce){.grow-anim .edge{animation:none!important;stroke-dashoffset:0!important}.branches{transition:none}}
</style>

 k1:[90,498,"各系加題、一課多師",1,"plan",{why:"各系題目五花八門，並希望一堂課多位老師都被評",orig:"只統計 5 題核心題，以課程為單位"}],
 k2:[105,610,"計分口徑不一"]
};
const E=[
 ["t2","x1","g"],["x1","x2","g"],["x2","m1","g"],["m1","m2","g"],["m2","t3","h"],["m2","t4","h"],
 ["t3","s1","g"],["s1","x2","m"],
 ["t2","y1","g"],["y1","y2","g"],["y2","y3","g"],["y3","x2","m"],
 ["t4","z1","g"],["z1","z2","g"],["z2","m1","m"],
 ["x2","z2","m"],["z2","q1","g"],["q1","a1","m"],
 ["t6","r1","g"],["r1","r2","g"],["r2","r3","g"],["r1","m1","m"],
 ["t8","p1","g"],["p1","p2","g"],
 ["t4","a1","g"],["a1","a2","g"],["a2","a3","g"],["a3","a4","g"],["a4","t7","h"],
 ["t2","h1","g"],["h1","h2","g"],["h2","h3","g"],["h3","t5","h"],
 ["t5","o1","g"],["o1","o2","g"],["o2","o3","g"],["o3","t7","h"],["o3","t8","h"],
 ["t1","k1","g"],["k1","k2","g"],["k2","t7","h"]
];
const isT=id=>T.some(t=>t.id===id);
const P=id=>{if(isT(id)){const t=T.find(x=>x.id===id);return {x:t.x,y:TY};}const n=N[id];return {x:n[0],y:n[1]};};
const state={mode:"before",sel:null,open:new Set(),exp:new Set(),prevN:new Set(),prevE:new Set()};
const ORIG=t=>E.filter(e=>e[0]===t&&e[2]==="g"&&!isT(e[1])).map(e=>e[1]);
function kids(id){return E.filter(e=>e[0]===id&&e[2]==="g"&&!isT(e[1])).map(e=>e[1]);}
function visibleSet(){const v=new Set();const q=[];state.open.forEach(t=>ORIG(t).forEach(o=>{if(!v.has(o)){v.add(o);q.push(o);}}));
  while(q.length){const c=q.shift();if(!state.exp.has(c))continue;kids(c).forEach(k=>{if(!v.has(k)){v.add(k);q.push(k);}});}return v;}
const NS="http://www.w3.org/2000/svg";
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const W=s=>{let w=0;for(const ch of s)w+=/[\x00-\x7F]/.test(ch)?7:12.8;return w;};
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function edgePath(a,b,type){
  const A=P(a),B=P(b);
  if(type==="h"){const by=B.y+(A.y<TY?-38:38);return `M${A.x},${A.y} C${(A.x+B.x)/2},${A.y} ${B.x},${A.y<TY?by-60:by+60} ${B.x},${by}`;}
  const ay=isT(a)?A.y+(B.y<TY?-38:38):A.y, by=B.y;
  return `M${A.x},${ay} C${A.x},${(ay+by)/2} ${B.x},${(ay+by)/2} ${B.x},${by}`;
}
function draw(){
  const svg=document.getElementById("map"); svg.innerHTML="";
  const defs=el("defs",{},svg);
  const mk=el("marker",{id:"arr",viewBox:"0 0 10 10",refX:"8",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);
  el("path",{d:"M0,0 L10,5 L0,10 z",fill:cssv("--red")},mk);
  const br=el("g",{class:"branches"+(state.mode==="after"?" grow-anim":""),id:"br",opacity:state.mode==="after"?1:0},svg);
  const vis=state.mode==="after"?visibleSet():new Set(), visE=new Set();
  E.forEach(([a,b,t],i)=>{
    const ok=(isT(a)||vis.has(a))&&(isT(b)?(t==="h"&&vis.has(a)&&state.exp.has(a)):vis.has(b)); if(!ok) return; visE.add(i);
    const p=el("path",{class:"edge"+(t==="m"?" merge":"")+(t==="h"?" hitl":"")+(state.prevE.has(i)?"":" new"),d:edgePath(a,b,t),"data-i":i},br);if(t==="h")p.setAttribute("marker-end","url(#arr)");});
  br.querySelectorAll(".edge:not(.hitl)").forEach(p=>p.style.setProperty("--len",p.getTotalLength()));
  for(const id in N){
    if(!vis.has(id)) continue;
    const [x,y,label,origin,st,,fix]=N[id];
    const g=el("g",{class:"bnode"+(origin?" origin":"")+(state.prevN.has(id)?"":" new"),"data-id":id,tabindex:state.mode==="after"?"0":"-1",role:"button","aria-label":label,transform:`translate(${x},${y})`},br);
    const w=W(label)+28;
    el("rect",{x:-w/2,y:-15,width:w,height:30,rx:15},g);
    if(st) el("circle",{cx:-w/2+12,cy:0,r:5,fill:cssv(ST[st].c)},g);
    el("text",{x:st?7:0,"text-anchor":"middle",dy:"0.35em"},g).textContent=label;
    const more=kids(id).length+E.filter(e=>e[0]===id&&e[2]==="h").length;
    if(more&&!state.exp.has(id)){const m=el("g",{class:"more",transform:`translate(${w/2},-12)`},g);el("circle",{r:8},m);el("text",{"text-anchor":"middle",dy:"0.35em"},m).textContent="+";}
    if(fix){const fw=W(fix)+18;const f=el("g",{class:"fix",transform:"translate(0,28)"},g);el("rect",{x:-fw/2,y:-10,width:fw,height:20},f);el("text",{"text-anchor":"middle",dy:"0.35em"},f).textContent="✓ "+fix;}
  }
  el("line",{class:"trunkline",x1:T[0].x,y1:TY,x2:T[T.length-1].x,y2:TY},svg);
  T.forEach(t=>{
    const g=el("g",{class:"tnode","data-id":t.id,tabindex:"0",role:"button","aria-label":t.n,transform:`translate(${t.x},${TY})`},svg);
    el("circle",{class:"c",r:36},g);
    el("text",{class:"e","text-anchor":"middle",dy:"0.36em"},g).textContent=t.e;
    el("text",{class:"n","text-anchor":"middle",y:-48},g).textContent=t.n;
    el("text",{class:"s","text-anchor":"middle",y:56},g).textContent=t.s;
    if(state.mode==="before"){const x=el("g",{class:"exp sp",transform:"translate(-28,-26)"},g);el("circle",{r:11},x);el("text",{"text-anchor":"middle",dy:"0.35em"},x).textContent=state.open.has(t.id)?"−":"+"+t.spec.length;}
    if(state.mode==="after"){
      const its=I.filter(x=>x[0]===t.id);
      const nd=its.filter(x=>x[2]==="done").length;
      const nb=ORIG(t.id).length;
      if(nb){const x=el("g",{class:"exp",transform:"translate(-28,-26)"},g);el("circle",{r:11},x);el("text",{"text-anchor":"middle",dy:"0.35em"},x).textContent=state.open.has(t.id)?"−":"+"+nb;}
      if(nd){const b=el("g",{class:"badge",transform:"translate(28,-26)"},g);el("circle",{r:11},b);el("text",{"text-anchor":"middle",dy:"0.35em"},b).textContent=nd;}
      const per=8,gap=9;
      its.forEach((it,i)=>{const row=Math.floor(i/per),col=i%per,n=Math.min(per,its.length-row*per);
        el("circle",{cx:(col-(n-1)/2)*gap,cy:70+row*10,r:3.6,fill:cssv(ST[it[2]].c)},g);});
    }
  });
  if(state.mode==="before"){
    T.filter(t=>state.open.has(t.id)).forEach(t=>{
      const g=el("g",{class:"spec fadein"},svg);
      const top=TY+80;
      el("line",{x1:t.x,y1:TY+66,x2:t.x,y2:top+(t.spec.length-1)*30+15,class:"stem"},g);
      t.spec.forEach((sp,i)=>{const y=top+i*30+15;const w=W(sp)+20;
        el("rect",{x:t.x-w/2,y:y-12,width:w,height:24,rx:12},g);
        el("text",{x:t.x,y,"text-anchor":"middle",dy:"0.35em"},g).textContent=sp;});
      if(t.note){const ny=top+t.spec.length*30+8;const lines=[t.note.t,...t.note.i];
        const w=Math.max(...lines.map(W))+20, h=lines.length*19+12;
        const ng=el("g",{class:"note fadein"},svg);
        el("rect",{x:t.x-w/2,y:ny,width:w,height:h,rx:6},ng);
        lines.forEach((ln,i)=>{const tx=el("text",{x:t.x,y:ny+20+i*19,"text-anchor":"middle",class:i?"":"nt"},ng);tx.textContent=ln;});}
    });
  }
  el("text",{class:"goal","text-anchor":"end",x:1180,y:state.mode==="after"?TY+100:70},svg).textContent="目的：讓學生安心匿名填答，學期末自動算出老師分數";
  state.prevN=vis; state.prevE=visE;
  apply();
}
function chain(id){
  const nodes=new Set([id]),edges=new Set(),order=[id];
  const down=[id],up=[id];
  while(down.length){const c=down.shift();E.forEach((e,i)=>{if(e[0]===c){edges.add(i);if(isT(e[1])) nodes.add(e[1]); else if(!nodes.has(e[1])){nodes.add(e[1]);order.push(e[1]);down.push(e[1]);}}});}
  while(up.length){const c=up.pop();E.forEach((e,i)=>{if(e[1]===c&&!isT(e[0])&&e[2]!=="h"&&state.prevN.has(e[0])){edges.add(i);if(!nodes.has(e[0])){nodes.add(e[0]);up.push(e[0]);}}});}
  return {nodes,edges,order};
}
function apply(){
  const ch=state.sel&&!isT(state.sel)?chain(state.sel):null;
  document.querySelectorAll(".bnode").forEach(g=>{const id=g.dataset.id;g.classList.toggle("on",!!ch&&ch.nodes.has(id));g.classList.toggle("dim",!!ch&&!ch.nodes.has(id));});
  document.querySelectorAll(".edge").forEach(p=>{const i=+p.dataset.i;p.classList.toggle("on",!!ch&&ch.edges.has(i));p.classList.toggle("dim",!!ch&&!ch.edges.has(i)&&!p.classList.contains("hitl"));});
  document.querySelectorAll(".tnode").forEach(g=>{const id=g.dataset.id;g.classList.toggle("hit",!!ch&&ch.nodes.has(id));g.classList.toggle("sel",state.sel===id);});
  renderCard(ch); renderStats(ch);
}
function renderStats(ch){
  const box=document.getElementById("stats");
  if(state.mode==="before"){box.innerHTML=`<span><b>8</b>步主線，一條路走到期末報表</span>`;return;}
  const c=k=>I.filter(x=>x[2]===k).length;
  box.innerHTML=`<span><b>${I.length}</b>項上線規格需求</span>`+Object.entries(ST).map(([k,v])=>`<span style="--c:var(${v.c})"><b style="color:var(${v.c})">${c(k)}</b>${v.l}</span>`).join("")+
    `<span class="r"><b>${Object.values(N).filter(n=>n[3]).length}</b>條分支牽動主線</span>`+(ch?`<span class="r"><b>${[...ch.nodes].filter(isT).length}</b>個主線節點受影響</span>`:"");
}
function itemGroups(list){
  const by=k=>list.filter(x=>x[2]===k);
  return Object.entries(ST).filter(([k])=>by(k).length).map(([k,v])=>`<div class="grp" style="--c:var(${v.c})"><h3><i></i>${v.l}（${by(k).length}）</h3><ul>${by(k).map(x=>`<li>${x[3]}<small>${x[4]}</small></li>`).join("")}</ul></div>`).join("");
}
function seqFrom(o,ch){const seen=new Set([o]),q=[o],out=[];
  while(q.length){const c=q.shift();E.forEach(e=>{if(e[0]===c&&e[2]!=="h"&&!isT(e[1])&&ch.nodes.has(e[1])&&!seen.has(e[1])){seen.add(e[1]);q.push(e[1]);if(!N[e[1]][3])out.push(e[1]);}});}
  return out;}
function renderCard(ch){
  const card=document.getElementById("card");
  if(!state.sel){
    card.style.setProperty("--c","var(--trunk)");
    card.innerHTML=state.mode==="before"
      ?`<h2>採購規格的設計</h2><dl><dt>做法</dt><dd>開課前備妥課程與問卷，各單位固定時間派送，一封信一個連結，學生匿名填答，期末自動算出老師分數。</dd><dt>功能規格</dt><dd>點主線節點（青色 + 號）展開該步驟的採購規格功能，以系統畫面名稱列出；虛線框為非採購規格的備註。也可以一鍵全部展開。</dd></dl>`
      :`<h2>上線規格</h2><dl><dt>看法</dt><dd>主線下方每個圓點是一項需求，顏色代表處理狀態；綠色數字是已完成項數。點主線節點（褐色 + 號）長出它的分支起點；再逐一點分支節點（+ 號）帶出下一步，直到紅色箭頭打回主線。不同節點的分支都展開後會以虛線相連。也可以一鍵全部展開。</dd><dt>全系統</dt><dd>${I.filter(x=>!x[0]).map(x=>`${x[3]}：${x[4]}`).join("；")}</dd></dl>`;
    return;}
  if(isT(state.sel)){
    const t=T.find(x=>x.id===state.sel);
    const its=I.filter(x=>x[0]===t.id);
    const hits=Object.keys(N).filter(id=>N[id][3]&&chain(id).nodes.has(t.id)).map(id=>N[id][2]);
    card.style.setProperty("--c","var(--trunk)");
    card.innerHTML=`<h2>${t.e} ${t.n}</h2><dl><dt>原本設計</dt><dd>${t.d}</dd><dt>採購規格</dt><dd><div class="chips">${t.spec.map(x=>`<span class="sp">${x}</span>`).join("")}</div><small style="color:var(--muted)">功能需求說明書 ${t.ref}</small></dd>${t.note?`<dt>備註</dt><dd>${t.note.t.replace("備註：","")}；目前建置：${t.note.i.join("、")}</dd>`:""}`+
      (state.mode==="after"&&hits.length?`<dt>被這些分支影響</dt><dd class="bad">${hits.join("、")}</dd>`:"")+`</dl>`+
      (state.mode==="after"&&its.length?`<div class="cols2" style="margin-top:10px">${itemGroups(its)}</div>`:"");
    return;}
  const origin=N[state.sel][3]?state.sel:ch.order.find(id=>N[id][3])||[...ch.nodes].find(id=>!isT(id)&&N[id][3]);
  const o=N[origin], st=ST[o[4]];
  const affected=[...ch.nodes].filter(isT).map(id=>T.find(t=>t.id===id).n);
  const its=I.filter(x=>x[1]&&ch.nodes.has(x[1]));
  card.style.setProperty("--c",`var(${st.c})`);
  card.innerHTML=`<h2>${o[2]}<span class="st" style="--sc:var(${st.c})">${st.l}</span></h2><dl>
    <dt>起因</dt><dd>${o[5].why}</dd>
    <dt>原本設計</dt><dd>${o[5].orig}</dd>
    <dt>連鎖影響</dt><dd class="bad">${seqFrom(origin,ch).map(id=>N[id][2]).join(" → ")||"—"}${affected.length?`；牽動主線：${affected.join("、")}`:""}</dd></dl>`+
    (its.length?`<div class="cols2" style="margin-top:10px">${itemGroups(its)}</div>`:"");
}
function renderMode(){
  document.getElementById("mode").innerHTML=[["before","採購規格","--trunk"],["after","上線規格","--grow"]].map(([k,l,c])=>`<button data-mode="${k}" aria-pressed="${state.mode===k}" style="--c:var(${c})">${l}</button>`).join("");
  document.getElementById("tools").innerHTML=`<button data-all="open">全部展開</button><button data-all="close">全部收合</button>`;
  document.getElementById("legend").innerHTML=state.mode==="after"?Object.values(ST).map(v=>`<span><i style="--c:var(${v.c})"></i>${v.l}</span>`).join(""):"";
}
document.addEventListener("click",e=>{
  const m=e.target.closest("[data-mode]");
  if(m){state.mode=m.dataset.mode;state.sel=null;state.open=new Set();state.exp=new Set();state.prevN=new Set();state.prevE=new Set();renderMode();draw();return;}
  const a=e.target.closest("[data-all]");
  if(a){const on=a.dataset.all==="open";state.open=on?new Set(T.map(t=>t.id).filter(id=>state.mode==="before"||ORIG(id).length)):new Set();state.exp=on?new Set(Object.keys(N)):new Set();state.sel=null;draw();return;}
  const n=e.target.closest(".bnode,.tnode");
  if(!n) return;
  if(n.classList.contains("tnode")&&(state.mode==="before"||ORIG(n.dataset.id).length)){
    const id=n.dataset.id;
    if(state.open.has(id)&&state.sel===id){state.open.delete(id);state.sel=null;}
    else {state.open.add(id);state.sel=id;}
    draw();return;}
  if(n.classList.contains("bnode")&&state.mode!=="after")return;
  const id=n.dataset.id;
  if(n.classList.contains("bnode")){
    const has=kids(id).length||E.some(e=>e[0]===id&&e[2]==="h");
    if(has&&!state.exp.has(id)){state.exp.add(id);state.sel=id;draw();return;}
    if(state.exp.has(id)&&state.sel===id){state.exp.delete(id);state.sel=null;draw();return;}
  }
  state.sel=state.sel===id?null:id;apply();
});
document.addEventListener("keydown",e=>{const n=e.target.closest&&e.target.closest(".bnode,.tnode");if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();n.dispatchEvent(new MouseEvent("click",{bubbles:true}));}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
renderMode(); draw();
</script>
